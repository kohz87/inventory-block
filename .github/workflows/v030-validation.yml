name: v0.3.0 validation

on:
  push:
    branches:
      - feature/history-inspection-v0.3.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
