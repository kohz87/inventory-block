name: v0.3.5 manual reconcile audit

on:
  push:
    branches:
      - feature/v0.3.5-manual-reconcile

permissions:
  contents: write

jobs:
  hardpass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.5-manual-reconcile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded v0.3.5 transform
        run: |
          python3 scripts/v035_transform.py
          python3 scripts/v035_patch.py
      - name: Full deterministic and fuzz suite
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Diff hygiene
        run: git diff --check
      - name: Repeat full regression suite
        run: npm test
      - name: Commit tested v0.3.5 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md TEST-REPORT.md index.js manifest.json package.json src/constants.js src/lifecycle.js src/settings.js style.css tests/integration-static.test.js tests/lifecycle.test.js tests/release.test.js tests/settings-ui.test.js tests/v035-manual-reconcile.test.js
          git commit -m "Inventory Block v0.3.5: add guarded manual reconciliation"
          git push origin HEAD:feature/v0.3.5-manual-reconcile
