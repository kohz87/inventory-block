name: v0.4.0 one-pass hardpass

on:
  push:
    branches:
      - feature/v0.4.0-one-pass

permissions:
  contents: write

jobs:
  hardpass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.4.0-one-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply post-review one-pass hardening
        run: python3 scripts/v040_postreview.py
      - name: Ten repeated hard-pass cycles
        run: |
          for i in $(seq 1 10); do
            echo "=== v0.4.0 post-review hard pass $i/10 ==="
            npm test
            npm run check
            git diff --check
          done
      - name: Commit reviewed v0.4.0 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md index.js src/state.js tests/v040-one-pass.test.js
          git commit -m "v0.4.0: harden foreground reconciliation boundaries"
          git push origin HEAD:feature/v0.4.0-one-pass
