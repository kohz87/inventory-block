name: v0.4.0 one-pass hardpass

on:
  push:
    branches:
      - feature/v0.4.0-one-pass

permissions:
  contents: write

jobs:
  hardpass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.4.0-one-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v0.4.0 one-pass transform
        run: python3 scripts/v040_one_pass.py
      - name: Ten repeated hard-pass cycles
        run: |
          for i in $(seq 1 10); do
            echo "=== v0.4.0 one-pass hard pass $i/10 ==="
            npm test
            npm run check
            git diff --check
          done
      - name: Commit tested v0.4.0 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md TEST-REPORT.md index.js manifest.json package.json src/constants.js src/protocol.js src/reconcile.js style.css tests/integration-static.test.js tests/release.test.js tests/v033-reconcile.test.js tests/v034-raw-compat.test.js tests/v035-manual-reconcile.test.js tests/v040-one-pass.test.js
          git commit -m "Inventory Block v0.4.0: one-pass foreground accounting"
          git push origin HEAD:feature/v0.4.0-one-pass
