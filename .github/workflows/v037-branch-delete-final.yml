name: v0.3.7 branch deletion final hardpass

on:
  push:
    branches:
      - audit/v0.3.7-branch-anchor-final

permissions:
  contents: write

jobs:
  hardpass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v0.3.7-branch-anchor-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply branch-specific deletion correction
        run: python3 scripts/v037_branch_durable_delete.py
      - name: Ten repeated hard-pass cycles
        run: |
          for i in $(seq 1 10); do
            echo "=== v0.3.7 branch-delete hard pass $i/10 ==="
            npm test
            npm run check
            git diff --check
          done
      - name: Commit reviewed branch-deletion fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/history.js src/state.js tests/v037-branch-anchor.test.js tests/v037-history-anchor.test.js tests/v037-runtime-static.test.js
          git commit -m "v0.3.7: preserve selected branch across deletion"
          git push origin HEAD:audit/v0.3.7-branch-anchor-final
