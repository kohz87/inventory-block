name: v0.4.1 interoperability hardpass

on:
  push:
    branches:
      - feature/v0.4.1-interoperability

jobs:
  hardpass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.4.1-interoperability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ten repeated hard-pass cycles
        run: |
          for i in $(seq 1 10); do
            echo "=== v0.4.1 interoperability hard pass $i/10 ==="
            npm test
            npm run check
            git diff --check
          done
      - name: Confirm clean audit head
        run: git status --short
