# verified-chunk restart after pass-1 findings
name: v0.3.2 hardening gate

on:
  push:
    branches:
      - audit/v0.3.2-hardening

permissions:
  contents: write

jobs:
  hardening:
    if: ${{ !contains(github.event.head_commit.message, '[v032-gated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble, verify, and apply v0.3.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/v032-part-* > /tmp/apply-v032.py.gz.b64
          test "$(wc -c < /tmp/apply-v032.py.gz.b64)" -eq 19228
          test "$(git hash-object /tmp/apply-v032.py.gz.b64)" = "381126850795573126032ba91f8b677dbf727bbc"
          base64 -d /tmp/apply-v032.py.gz.b64 | gzip -d > /tmp/apply-v032.py
          python -m py_compile /tmp/apply-v032.py
          python /tmp/apply-v032.py
          git diff --check

      - name: Ten uninterrupted full hard passes
        shell: bash
        run: |
          set -euo pipefail
          for pass in $(seq 1 10); do
            echo "========== HARD PASS ${pass}/10 =========="
            npm test
            npm run check
            git diff --check
          done

      - name: Commit only after pass 10
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v032-hardening.yml scripts/apply-v032.py.gz.b64 scripts/v032-part-*
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rmdir scripts 2>/dev/null || true
          git diff --check
          git status --short
          git config user.name "kohz87"
          git config user.email "83744063+kohz87@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Inventory Block v0.3.2: deep hardening [v032-gated]"
          git push origin HEAD:audit/v0.3.2-hardening
