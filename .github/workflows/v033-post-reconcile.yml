name: v0.3.3 post-response reconciliation audit

on:
  push:
    branches:
      - feature/v0.3.3-post-response-reconcile

permissions:
  contents: write

jobs:
  hardpass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded v0.3.3 transform
        run: python scripts/v033_transform.py
      - name: Full deterministic and fuzz suite
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Diff hygiene
        run: git diff --check
      - name: Repeat regression suite after checks
        run: npm test
      - name: Commit tested source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md TEST-REPORT.md index.js manifest.json package.json src style.css tests
          git commit -m "Inventory Block v0.3.3: post-response reconciliation"
          git push
