name: v0.3.6 streaming UI hardpass

on:
  push:
    branches:
      - audit/v0.3.6-streaming-ui-hardening-ci

permissions:
  contents: write

jobs:
  hardpass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v0.3.6-streaming-ui-hardening-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded v0.3.6 transform
        run: |
          python3 scripts/v036_streaming_fix.py
          python3 scripts/v036_testfix.py
      - name: Full deterministic and fuzz suite
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Diff hygiene
        run: git diff --check
      - name: Repeat full regression suite
        run: npm test
      - name: Commit tested v0.3.6 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md TEST-REPORT.md index.js manifest.json package.json src/constants.js src/megumin.js style.css tests/integration-static.test.js tests/release.test.js tests/v036-streaming-ui.test.js
          git commit -m "Inventory Block v0.3.6: freeze UI during streaming"
          git push origin HEAD:audit/v0.3.6-streaming-ui-hardening-ci
