name: v0.3.4 generateRaw compatibility audit

on:
  push:
    branches:
      - hotfix/v0.3.4-generate-raw

permissions:
  contents: write

jobs:
  hardpass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded v0.3.4 transform
        run: python scripts/v034_transform.py
      - name: Full deterministic and fuzz suite
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Diff hygiene
        run: git diff --check
      - name: Repeat full regression suite
        run: npm test
      - name: Commit tested v0.3.4 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md TEST-REPORT.md index.js manifest.json package.json src style.css tests
          git commit -m "Inventory Block v0.3.4: use generateRaw reconciliation"
          git push
