name: Inventory 0.2.7 terminal sentinel hotfix

on:
  push:
    branches:
      - inventory-0.2.7-stage

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch and test
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/inventory_027_patch.py
          npm test
          npm run check
          git config user.name 'kohz87'
          git config user.email '83744063+kohz87@users.noreply.github.com'
          git rm .github/workflows/inventory-027-hotfix.yml .github/scripts/inventory_027_patch.py
          git add -A
          git commit -m 'Inventory Block v0.2.7 terminal sentinel hotfix'
          git push origin HEAD:inventory-0.2.7-stage
