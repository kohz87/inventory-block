name: Inventory 0.2.6 operation normalization hotfix

on:
  push:
    branches:
      - inventory-0.2.6-stage

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply operation normalization hotfix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          protocol = Path('src/protocol.js')
          text = protocol.read_text()

          old = '''`If a JSON string would contain the literal sequence -->, encode the > as \\u003e inside that JSON string.\\n` +
          `Ops: add_category{name}; rename_category{category,name}; delete_category{category,confirm?}; add_item{category,name,quantity,remark}; set_item{category,name,quantity?,remark?}; adjust_item{category,name,by}; edit_item{category,name,newName?,quantity?,remark?}; delete_item{category,name}; move_item{fromCategory,toCategory,name}.\\n` +'''
          new = '''`If a JSON string would contain the literal sequence -->, encode the > as \\u003e inside that JSON string.\\n` +
          `Every object in "ops" MUST contain a string "op" field. Canonical example: {"mode":"patch","ops":[{"op":"add_item","category":"General","name":"Potion","quantity":"1","remark":""}]}.\\n` +
          `Use these exact "op" values: add_category, rename_category, delete_category, add_item, set_item, adjust_item, edit_item, delete_item, move_item.\\n` +
          `Fields by op: add_category{name}; rename_category{category,name}; delete_category{category,confirm?}; add_item{category,name,quantity,remark}; set_item{category,name,quantity?,remark?}; adjust_item{category,name,by}; edit_item{category,name,newName?,quantity?,remark?}; delete_item{category,name}; move_item{fromCategory,toCategory,name}.\\n` +'''
          if old not in text:
              raise SystemExit('prompt operation grammar anchor not found')
          text = text.replace(old, new, 1)

          old = '''function quantityWouldDelete(value) {
              const number = numericQuantity(value);
              return number !== null && number <= 0;
          }

          function applyPatchOperation(state, op) {
              if (!op || typeof op !== 'object' || Array.isArray(op)) throw new Error('Inventory operation must be an object.');
              if (typeof op.op !== 'string' || !op.op.trim()) throw new Error('Inventory operation requires a string op field.');
              switch (op.op) {'''
          new = '''function quantityWouldDelete(value) {
              const number = numericQuantity(value);
              return number !== null && number <= 0;
          }

          const PATCH_OPERATION_NAMES = new Set([
              'add_category',
              'rename_category',
              'delete_category',
              'add_item',
              'set_item',
              'adjust_item',
              'edit_item',
              'delete_item',
              'move_item',
          ]);

          function normalizePatchOperation(raw, index) {
              const label = `Inventory operation #${index + 1}`;
              if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
                  throw new Error(`${label} must be an object.`);
              }

              const has = key => Object.hasOwn(raw, key);
              if (has('op')) {
                  if (typeof raw.op !== 'string' || !raw.op.trim()) {
                      throw new Error(`${label} requires a non-empty string "op" field. Expected e.g. {"op":"add_item",...}.`);
                  }
                  const name = raw.op.trim();
                  for (const alias of ['operation', 'action']) {
                      if (!has(alias)) continue;
                      if (typeof raw[alias] !== 'string' || !raw[alias].trim()) {
                          throw new Error(`${label} has an invalid "${alias}" alias.`);
                      }
                      if (raw[alias].trim() !== name) {
                          throw new Error(`${label} has conflicting operation names in "op" and "${alias}".`);
                      }
                  }
                  return { ...raw, op: name };
              }

              const aliases = [];
              for (const alias of ['operation', 'action']) {
                  if (!has(alias)) continue;
                  if (typeof raw[alias] !== 'string' || !raw[alias].trim()) {
                      throw new Error(`${label} has an invalid "${alias}" alias.`);
                  }
                  aliases.push(raw[alias].trim());
              }
              if (aliases.length) {
                  const unique = [...new Set(aliases)];
                  if (unique.length !== 1) {
                      throw new Error(`${label} has conflicting operation aliases.`);
                  }
                  return { ...raw, op: unique[0] };
              }

              const keys = Object.keys(raw);
              if (keys.length === 1 && PATCH_OPERATION_NAMES.has(keys[0])) {
                  const nestedName = keys[0];
                  const nested = raw[nestedName];
                  if (!nested || typeof nested !== 'object' || Array.isArray(nested)) {
                      throw new Error(`${label} nested "${nestedName}" value must be an object.`);
                  }
                  if (Object.hasOwn(nested, 'op') || Object.hasOwn(nested, 'operation') || Object.hasOwn(nested, 'action')) {
                      throw new Error(`${label} nested "${nestedName}" form must not contain another operation selector.`);
                  }
                  return { ...nested, op: nestedName };
              }

              throw new Error(`${label} is missing "op". Expected e.g. {"op":"add_item",...}.`);
          }

          function applyPatchOperation(state, op) {
              if (!op || typeof op !== 'object' || Array.isArray(op)) throw new Error('Inventory operation must be an object.');
              if (typeof op.op !== 'string' || !op.op.trim()) throw new Error('Inventory operation requires a non-empty string "op" field.');
              switch (op.op) {'''
          if old not in text:
              raise SystemExit('patch operation normalization anchor not found')
          text = text.replace(old, new, 1)

          old = '''    const state = normalizeInventory(clone(baseState));
              for (const op of payload.ops) applyPatchOperation(state, op);
              return validateAndNormalizeInventory(state);'''
          new = '''    const state = normalizeInventory(clone(baseState));
              for (let index = 0; index < payload.ops.length; index++) {
                  applyPatchOperation(state, normalizePatchOperation(payload.ops[index], index));
              }
              return validateAndNormalizeInventory(state);'''
          if old not in text:
              raise SystemExit('applyPayload loop anchor not found')
          text = text.replace(old, new, 1)
          protocol.write_text(text)

          tests = Path('tests/protocol.test.js')
          text = tests.read_text()
          extra = r'''

test('prompt explicitly requires the canonical string op field', () => {
  const prompt = buildInventoryPrompt(inv([]));
  assert.match(prompt, /Every object in "ops" MUST contain a string "op" field/);
  assert.match(prompt, /"op":"add_item"/);
});

test('weak-model operation and action aliases normalize safely', () => {
  const variants = [
    {operation:'add_item',category:'General',name:'Potion',quantity:'1',remark:'alias operation'},
    {action:'add_item',category:'General',name:'Potion',quantity:'1',remark:'alias action'},
    {add_item:{category:'General',name:'Potion',quantity:'1',remark:'nested alias'}},
  ];
  for (const op of variants) {
    const result = consumeInventoryUpdates(control({mode:'patch',ops:[op]}), inv([]));
    assert.deepEqual(result.errors, []);
    assert.equal(result.changed, true);
    assert.equal(result.state.categories[0].items[0].name, 'Potion');
  }
});

test('matching operation aliases may coexist but conflicting aliases reject atomically', () => {
  const matching = consumeInventoryUpdates(control({mode:'patch',ops:[{
    operation:'add_item',action:'add_item',category:'General',name:'Potion',quantity:'1',remark:''
  }]}), inv([]));
  assert.deepEqual(matching.errors, []);
  assert.equal(matching.changed, true);

  const base = inv([{name:'General',items:[item('Coin','1','keep')]}]);
  const conflicting = consumeInventoryUpdates(control({mode:'patch',ops:[{
    operation:'add_item',action:'delete_item',category:'General',name:'Potion',quantity:'1',remark:''
  }]}), base);
  assert.equal(conflicting.changed, false);
  assert.match(conflicting.errors.join(' '), /conflicting operation aliases/i);
  assert.deepEqual(conflicting.state, base);
});

test('missing op error identifies the failing operation and shows canonical shape', () => {
  const base = inv([{name:'General',items:[item('Coin','1','keep')]}]);
  const result = consumeInventoryUpdates(control({mode:'patch',ops:[
    {op:'add_category',name:'Supplies'},
    {category:'General',name:'Potion',quantity:'1'}
  ]}), base);
  assert.equal(result.changed, false);
  assert.match(result.errors.join(' '), /operation #2 is missing "op"/i);
  assert.match(result.errors.join(' '), /"op":"add_item"/i);
  assert.deepEqual(result.state, base);
});

test('canonical non-string op is not rescued by an alias', () => {
  const result = consumeInventoryUpdates(control({mode:'patch',ops:[{
    op:{name:'add_item'},operation:'add_item',category:'General',name:'Potion',quantity:'1'
  }]}), inv([]));
  assert.equal(result.changed, false);
  assert.match(result.errors.join(' '), /requires a non-empty string "op" field/i);
});
'''
          if "weak-model operation and action aliases normalize safely" not in text:
              text += extra
          tests.write_text(text)

          fuzz = Path('tests/hardpass-fuzz.mjs')
          text = fuzz.read_text()
          anchor = '''for(let i=0;i<500;i++){
            const state={categories:[{name:`${pick(i)}-${i}`,items:[{name:`${pick(i+1)}|${i}`,quantity:'1',remark:`${pick(i+2)}<&>${i}`}]}]};'''
          insert = '''for(let i=0;i<600;i++){
            const common={category:'General',name:`Alias${i}`,quantity:'1',remark:`variant ${i}`};
            const op=i%3===0?{operation:'add_item',...common}:i%3===1?{action:'add_item',...common}:{add_item:common};
            const payload={mode:'patch',ops:[op]};
            const c=`<!-- INVENTORY_BLOCK_UPDATE ${JSON.stringify(payload)} -->.`;
            const r=consumeInventoryUpdates(c,{categories:[]});
            assert.deepEqual(r.errors,[]);
            assert.equal(r.state.categories[0].items[0].name,`Alias${i}`);
          }

          for(let i=0;i<500;i++){
            const state={categories:[{name:`${pick(i)}-${i}`,items:[{name:`${pick(i+1)}|${i}`,quantity:'1',remark:`${pick(i+2)}<&>${i}`}]}]};'''
          if anchor not in text:
              raise SystemExit('hardpass fuzz insertion anchor not found')
          text = text.replace(anchor, insert, 1)
          fuzz.write_text(text)

          for path in ['manifest.json','package.json']:
              p = Path(path)
              data = json.loads(p.read_text())
              data['version'] = '0.2.6'
              p.write_text(json.dumps(data, indent=2) + '\n')

          constants = Path('src/constants.js')
          text = constants.read_text()
          text = text.replace("export const VERSION = '0.2.4';", "export const VERSION = '0.2.6';", 1)
          text = text.replace("export const VERSION = '0.2.5';", "export const VERSION = '0.2.6';", 1)
          constants.write_text(text)

          p = Path('style.css')
          text = p.read_text().replace('/* Inventory Block v0.2.5 */', '/* Inventory Block v0.2.6 */', 1)
          p.write_text(text)

          p = Path('README.md')
          text = p.read_text().replace('# Inventory Block v0.2.5', '# Inventory Block v0.2.6', 1)
          p.write_text(text)

          p = Path('TEST-REPORT.md')
          text = p.read_text().replace('# Inventory Block v0.2.5 Hotfix Report', '# Inventory Block v0.2.6 Hotfix Report', 1)
          insert = '''\n## v0.2.6 operation-shape resilience\n\nThe canonical machine format now explicitly requires a string `"op"` field in every patch operation. The parser safely normalizes unambiguous weak-model variants using `"operation"`, `"action"`, or a single recognized nested operation key, while conflicting or malformed selectors remain atomic rejections. Runtime and release version stamps are synchronized.\n'''
          if '## v0.2.6 operation-shape resilience' not in text:
              text = text.replace('\n## Scope\n', insert + '\n## Scope\n', 1)
          p.write_text(text)

          p = Path('CHANGELOG.md')
          text = p.read_text()
          entry = '''## 0.2.6\n\nOperation-shape resilience hotfix.\n\n- The prompt now explicitly requires a string `"op"` field in every patch operation and includes a canonical add-item example.\n- Safely normalizes unambiguous weak-model aliases: `"operation"`, `"action"`, and `{ "add_item": { ... } }`-style single-key wrappers.\n- Conflicting aliases, malformed canonical `op` values, and ambiguous wrappers remain rejected atomically.\n- Missing-operation errors now identify the failing operation index and show the expected canonical shape.\n- Synchronizes the runtime VERSION constant with release metadata.\n\n'''
          if '## 0.2.6' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(text)

          Path('tests/release.test.js').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read = p => fs.readFileSync(new URL(`../${p}`, import.meta.url), 'utf8');

          test('all release metadata and runtime VERSION say 0.2.6', () => {
            assert.equal(JSON.parse(read('manifest.json')).version, '0.2.6');
            assert.equal(JSON.parse(read('package.json')).version, '0.2.6');
            assert.match(read('src/constants.js'), /VERSION = '0\.2\.6'/);
            assert.match(read('style.css'), /^\/\* Inventory Block v0\.2\.6 \*\//);
            assert.match(read('README.md'), /Inventory Block v0\.2\.6/);
            assert.match(read('TEST-REPORT.md'), /v0\.2\.6 Hotfix/);
          });

          test('changelog retains pipeline hardening and documents 0.2.6 aliases', () => {
            const changelog=read('CHANGELOG.md');
            assert.match(changelog,/## 0\.2\.6/);
            assert.match(changelog,/synthetic\/base64/i);
            assert.match(changelog,/before or after other structured\/Megumin blocks/i);
            assert.match(changelog,/Operation-shape resilience/i);
          });

          test('0.2.6 protocol keeps Megumin-safe placement and explicit canonical op grammar', () => {
            const protocol=read('src/protocol.js');
            assert.doesNotMatch(protocol,/must be the final non-whitespace content/i);
            assert.match(protocol,/Other required response blocks may appear before or after it/i);
            assert.match(protocol,/Every object in "ops" MUST contain a string "op" field/);
            assert.match(protocol,/normalizePatchOperation/);
          });
          '''.replace('          ', ''))

          Path('tests/integration-static.test.js').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const index=fs.readFileSync(new URL('../index.js',import.meta.url),'utf8');
          const constants=fs.readFileSync(new URL('../src/constants.js',import.meta.url),'utf8');
          const manifest=JSON.parse(fs.readFileSync(new URL('../manifest.json',import.meta.url),'utf8'));
          const pkg=JSON.parse(fs.readFileSync(new URL('../package.json',import.meta.url),'utf8'));

          test('release metadata, runtime version, and interceptor are v0.2.6',()=>{
            assert.equal(manifest.version,'0.2.6');
            assert.equal(pkg.version,'0.2.6');
            assert.match(constants,/VERSION = '0\.2\.6'/);
            assert.equal(manifest.generate_interceptor,'inventoryBlockGenerationInterceptor');
            assert.match(index,/globalThis\.inventoryBlockGenerationInterceptor\s*=\s*onGenerationInterceptor/);
          });

          test('v0.2.6 has no fake prompt slot or global live extension prompt',()=>{
            assert.doesNotMatch(index,/promptSlots|createPromptSlotMarker|insertPromptSlot|setExtensionPrompt/);
            assert.doesNotMatch(index,/inventoryBlockSlot|base64/i);
          });

          test('terminal events are cleanup-only and MESSAGE_RECEIVED remains commit path',()=>{
            assert.match(index,/GENERATION_ENDED[^\n]*onGenerationEnded/);
            assert.match(index,/MESSAGE_RECEIVED[^\n]*processAssistantMessage/);
            assert.doesNotMatch(index,/onGenerationEnded\([\s\S]{0,500}createRevision/);
          });

          test('existing initial group greetings are scanned on load',()=>{
            assert.match(index,/seedInitialGreetingsIfNeeded/);
            assert.match(index,/seed_existing/);
          });
          '''.replace('          ', ''))
          PY

          npm test
          npm run check

          git config user.name 'kohz87'
          git config user.email '83744063+kohz87@users.noreply.github.com'
          git rm .github/workflows/inventory-026-hotfix.yml
          git add -A
          git commit -m 'Inventory Block v0.2.6 operation normalization hotfix'
          git push origin HEAD:inventory-0.2.6-stage
