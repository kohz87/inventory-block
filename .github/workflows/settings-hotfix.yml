name: Inventory Block settings hotfix

on:
  push:
    branches: [settings-hotfix-pack-20260901]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply settings-panel hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.js')
          s = p.read_text()
          old = '''function addExtensionMenuButton() {
              if (document.querySelector('#inventory_block_menu')) return true;
              const menu = document.querySelector('#extensionsMenu');
              if (!menu) return false;
              const item = document.createElement('div');
              item.id = 'inventory_block_menu';
              item.className = 'list-group-item flex-container flexGap5';
              item.title = `Inventory Block v${VERSION}`;
              item.innerHTML = '<div class="fa-solid fa-box-open extensionsMenuExtensionButton"></div><span>Inventory</span>';
              item.addEventListener('click', openEditor);
              menu.appendChild(item);
              return true;
          }

          function ensureMenuButton() {
              if (addExtensionMenuButton()) {
                  if (menuRetry) clearTimeout(menuRetry);
                  menuRetry = null;
                  return;
              }
              if (!menuRetry) menuRetry = setTimeout(() => { menuRetry = null; ensureMenuButton(); }, 250);
          }
          '''
          new = '''function addExtensionMenuButton() {
              if (document.querySelector('#inventory_block_menu')) return true;
              const menu = document.querySelector('#extensionsMenu');
              if (!menu) return false;
              const item = document.createElement('div');
              item.id = 'inventory_block_menu';
              item.className = 'list-group-item flex-container flexGap5';
              item.title = `Inventory Block v${VERSION}`;
              item.innerHTML = '<div class="fa-solid fa-box-open extensionsMenuExtensionButton"></div><span>Inventory</span>';
              item.addEventListener('click', openEditor);
              menu.appendChild(item);
              return true;
          }

          function addExtensionSettingsPanel() {
              if (document.querySelector('#inventory_block_settings')) return true;
              const host = document.querySelector('#extensions_settings') ?? document.querySelector('#extensions_settings2');
              if (!host) return false;

              const wrapper = document.createElement('div');
              wrapper.id = 'inventory_block_settings';
              wrapper.className = 'inventory-block-settings';
              wrapper.innerHTML = `
                  <div class="inline-drawer">
                      <div class="inline-drawer-toggle inline-drawer-header">
                          <b>Inventory Block</b>
                          <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
                      </div>
                      <div class="inline-drawer-content">
                          <div class="inventory-block-settings-version">v${VERSION} · per-chat backend inventory</div>
                          <div class="inventory-block-settings-actions">
                              <button id="inventory_block_settings_edit" type="button" class="menu_button">
                                  <i class="fa-solid fa-pen-to-square"></i> Edit Inventory
                              </button>
                              <button id="inventory_block_settings_history" type="button" class="menu_button">
                                  <i class="fa-solid fa-clock-rotate-left"></i> History
                              </button>
                              <button id="inventory_block_settings_copy" type="button" class="menu_button">
                                  <i class="fa-solid fa-copy"></i> Copy Block
                              </button>
                          </div>
                          <div class="inventory-block-settings-note">
                              Inventory state is stored per chat and injected into the LLM automatically.
                          </div>
                      </div>
                  </div>`;

              wrapper.querySelector('#inventory_block_settings_edit')?.addEventListener('click', openEditor);
              wrapper.querySelector('#inventory_block_settings_history')?.addEventListener('click', openHistory);
              wrapper.querySelector('#inventory_block_settings_copy')?.addEventListener('click', copyInventoryBlock);
              host.appendChild(wrapper);
              return true;
          }

          function ensureExtensionUiEntries() {
              const menuReady = addExtensionMenuButton();
              const settingsReady = addExtensionSettingsPanel();
              if (menuReady && settingsReady) {
                  if (menuRetry) clearTimeout(menuRetry);
                  menuRetry = null;
                  return;
              }
              if (!menuRetry) menuRetry = setTimeout(() => { menuRetry = null; ensureExtensionUiEntries(); }, 250);
          }
          '''
          if old not in s:
              raise SystemExit('expected extension menu block not found')
          s = s.replace(old, new)
          s = s.replace('ensureMenuButton();', 'ensureExtensionUiEntries();')
          p.write_text(s)

          p = Path('src/constants.js')
          s = p.read_text().replace("export const VERSION = '0.2.1';", "export const VERSION = '0.2.2';")
          p.write_text(s)

          p = Path('package.json')
          data = json.loads(p.read_text())
          data['version'] = '0.2.2'
          p.write_text(json.dumps(data, indent=2) + '\n')

          p = Path('manifest.json')
          data = json.loads(p.read_text())
          data['version'] = '0.2.2'
          p.write_text(json.dumps(data, indent=2) + '\n')

          p = Path('style.css')
          s = p.read_text().replace('/* Inventory Block v0.2.1 */', '/* Inventory Block v0.2.2 */', 1)
          s += '''\n.inventory-block-settings .inline-drawer-content{padding:8px 10px 12px}\n.inventory-block-settings-version{margin-bottom:8px;opacity:.72;font-size:.9em}\n.inventory-block-settings-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}\n.inventory-block-settings-note{opacity:.65;font-size:.86em;line-height:1.35}\n'''
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text().replace('Inventory Block v0.2.1', 'Inventory Block v0.2.2')
          old_editor = '''## Editor

          Open **Extensions → Inventory** or click `Edit inventory` in the Inventory tab.

          The editor supports:
          '''
          new_editor = '''## Extensions settings and editor

          Inventory Block registers a standard SillyTavern settings drawer in the **Extensions** panel. The drawer provides `Edit Inventory`, `History`, and `Copy Block`. The existing wand-menu **Inventory** shortcut remains available as a quick entry point.

          You can also click `Edit inventory` directly in the Inventory tab.

          The editor supports:
          '''
          if old_editor not in s:
              raise SystemExit('README editor section not found')
          s = s.replace(old_editor, new_editor)
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## 0.2.2

          Extensions-panel UI hotfix.

          - Added a standard SillyTavern **Extensions settings** drawer under `#extensions_settings` with `#extensions_settings2` fallback.
          - Added `Edit Inventory`, `History`, and `Copy Block` actions to the settings drawer.
          - Kept the existing wand-menu Inventory shortcut as a convenience rather than using it as the only entry point.
          - Settings-panel and wand-menu mounting now share one retry path so both appear reliably when SillyTavern finishes building the UI.
          - Added a regression test that verifies both settings hosts and all three settings actions remain wired.

          '''
          if '## 0.2.2\n' not in s:
              s = s.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(s)
          PY

          cat > tests/settings-ui.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const source = fs.readFileSync(new URL('../index.js', import.meta.url), 'utf8');

          test('standard SillyTavern Extensions settings drawer remains wired', () => {
              assert.match(source, /#extensions_settings/);
              assert.match(source, /#extensions_settings2/);
              assert.match(source, /inventory_block_settings_edit/);
              assert.match(source, /inventory_block_settings_history/);
              assert.match(source, /inventory_block_settings_copy/);
              assert.match(source, /ensureExtensionUiEntries/);
          });
          EOF

          npm test
          npm run check

          git rm .github/workflows/settings-hotfix.yml
          git config user.name "Inventory Block hotfix"
          git config user.email "inventory-block-hotfix@users.noreply.github.com"
          git add -A
          git commit -m "Add Inventory Block Extensions settings panel"
          git push origin HEAD:settings-hotfix-result-20260901 --force
