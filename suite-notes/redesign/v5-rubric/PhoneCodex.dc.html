<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story Suite phone Codex</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#C2361A}a:hover{color:#8F2410}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.chat}}; color: {{t.ink}}; font-family: Barlow, system-ui, sans-serif; overflow: hidden">

  <header style="flex: none; padding: 22px 20px 0 20px">
    <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
        <h1 style="margin: 0; font: 800 46px/0.86 'Barlow Condensed', sans-serif; text-transform: uppercase">Bluewatch</h1>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
          <span style="font: 700 12px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: {{t.faint}}">Gw 12</span>
          <span style="font: 700 30px/0.9 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums">8:30</span>
        </div>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap; font: 700 13px/1.2 'Barlow Condensed', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: {{t.faint}}">
        <span>Guild hall</span><span aria-hidden="true">·</span><span>Drizzle</span><span aria-hidden="true">·</span><span style="color: {{t.acc}}">3s 8c −1s</span>
      </div>
    </div>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: {{t.panel}}; border-top: 4px solid {{t.ink}}">
    <a href="Phone.dc.html" aria-label="Back to the story" style="flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 20px; color: {{t.faint}}; text-decoration: none; border-bottom: 1px solid {{t.rule}}">
      <span style="font: 700 12px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.16em; text-transform: uppercase">Codex · back to the story</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg>
    </a>
    <div style="flex: 1 1 auto; min-height: 0">
      <dc-import name="Codex" dark="{{dark}}" tab="{{tab}}" height="{{h}}" hint-size="390px,660px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"tab":{"editor":"enum","options":["you","world","journal"],"default":"you"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const T = {
      light: { chat: '#F4F4F1', panel: '#FFFFFF', ink: '#16161A', faint: '#676870', rule: '#DEDED9', acc: '#C2361A' },
      dark:  { chat: '#111113', panel: '#18181B', ink: '#EDEBE6', faint: '#93918B', rule: '#2E2E33', acc: '#FF6E4A' }
    };
    return { dark: dark, tab: this.props.tab ?? 'you', h: 668, t: dark ? T.dark : T.light };
  }
}
</script>
</body>
</html>
