name: Inventory Block CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Diff check
        run: git diff --check
      - name: Syntax check
        run: npm run check
      - name: Behavioral and fuzz tests
        run: npm test
